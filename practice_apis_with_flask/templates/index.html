<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="icon" type="image/x-icon" href="https://www.svgrepo.com/show/213980/ai-ai.svg">
    <title>AI Compare the face</title>
</head>
<style>
    * {
        font-family: "Roboto Light";
        font-weight: bold;
    }
</style>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
<div class="container" style="max-width: 750px; margin: 0 auto">
    <!-- Input -->
    <div class="mt-4">
        <form class="form-control p-4" enctype="multipart/form-data" action="{{ url_for('displayTemplate') }}"
              method="post">
            <div class="row mb-3 mt-3" style="margin-left: 10px">
                <div class="col" style="width: 15px; display: contents">
                    <label class="form-control-lg">Your picture</label>
                </div>
                <div class="col">
                    <input style="width: 350px" class="form-control form-control-lg" id="formFileLg" type="file"
                           name="file">
                </div>
                <div class="col">
                    <button style="width: 105px; padding: 11px" type="submit" class="btn btn-secondary">send</button>
                </div>
            </div>
        </form>
    </div>
    <!--<h1>Rendered Image {{ filename }}</h1>
    <img src= "{{url_for('static', filename='images/1003.jpg')}}" >
    <img src="{{image}}"> -->

    {% if displayCard %}
    <!-- Output if picture uploaded -->
    <div class="mt-4">
        <div class="card">
            <div style="max-width: 450px; margin: 25px auto 0;">
                <img style="width: 400px;  border-radius: 100%;height: 400px; border: 10px solid rgb(79, 79, 83)"
                     src="{{path}}"
                     class="card-img-top" alt="...">
            </div>
            <div class="card-body">
                <p class="card-text text-center">Filename : {{filename}}</p>
                <p class="card-text text-center">Time to uploaded : {{timeUploaded}} </p>
                <div style="justify-content: center; display: flex">
                    <button style="width: 125px; padding: 11px" type="submit" class="btn btn-secondary ">Open camera</button>
                </div>
            </div>
        </div>
    </div>
    {% else %}
    <!-- Output if picture didn't upload -->
    <div class="mt-4">
        <div class="card" style="height: 650px;justify-content: center;text-align: center">
            <h2>Rendered Picture Here</h2>
        </div>
    </div>
    {% endif %}
</div>

</body>
</html>
